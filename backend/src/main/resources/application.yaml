spring:
  application:
    name: backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/Enunas}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration

  jpa:
    hibernate:
      # Flyway owns the schema (see db/migration). Hibernate only validates that the
      # entity model matches the migrated schema; it never modifies the database.
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  mail:
    # No code-level defaults: a missing MAIL_* var must fail app startup loudly, not silently fall
    # back to a provider we've moved away from (was Gmail; see CLAUDE.md for the current provider).
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          # JavaMail's defaults are infinite — without these, a provider that accepts the TCP
          # connection and then stalls (vs. cleanly refusing) pins the request thread indefinitely.
          # Emails are best-effort (see the *EmailListener classes) but the thread they run on isn't
          # free until one of these fires.
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

server:
  port: 8080

security:
  jwt:
    secret-key: ${JWT_SECRET}
    expiration-time: ${JWT_EXPIRATION:86400000}

admin:
  email: ${ADMIN_EMAIL:admin@enunas.com}
  password: ${ADMIN_PASSWORD}

enunas:
  mail:
    # The sender address, deliberately separate from spring.mail.username (SMTP auth identity) —
    # see EmailService for why they must never be conflated again. Must be an address at a domain
    # verified in whatever provider MAIL_HOST points at (Resend, currently) — an unverified sender
    # domain gets silently rejected by the provider, not caught here.
    from-address: ${MAIL_FROM_ADDRESS}
  platform:
    commission-rate: 0.18
  payout:
    hold-days: 7
    release-cron: "0 0 2 * * ?"
  vat:
    product-rate: 0.19
    service-rate: 0.19
  brand:
    # When true, USt-IdNr is a hard onboarding requirement (@NotBlank-style; never format-validated).
    vat-id-required: false
  shipping:
    default-rate: 4.99
  media:
    bucket: ${S3_BUCKET:enunas-media}
    region: ${AWS_REGION:eu-central-1}
    cdn-base-url: ${MEDIA_CDN_BASE_URL:}
    endpoint: ${S3_ENDPOINT:}
    presign-ttl: ${MEDIA_PRESIGN_TTL:PT10M}

mollie:
  api:
    key: ${MOLLIE_API_KEY}
  webhook:
    url: ${MOLLIE_WEBHOOK_URL}

google:
  oauth:
    client-id: ${GOOGLE_OAUTH_CLIENT_ID}

app:
  frontend:
    base-url: ${FRONTEND_BASE_URL:http://localhost:3000}
  cors:
    # Comma-separated list, no spaces. Must be exact origins (scheme + host, no path) — the
    # browser sends the Origin header as-is and Spring does a literal match against this list.
    # apex and www are different origins to the browser, so both are listed by default.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,https://enunas.com,https://www.enunas.com}
